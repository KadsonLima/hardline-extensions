<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hardline Config - TEST</title>
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #00d9ff; }
        .test { 
            background: rgba(0,217,255,0.1);
            padding: 20px;
            border: 2px solid #00d9ff;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🧪 TESTE - Config Hardline</h1>
    <div class="test">
        <p>✅ Se você vê esta mensagem, o arquivo HTML está carregando!</p>
        <p id="status">Aguardando Twitch SDK...</p>
    </div>
    
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script>
        document.getElementById('status').textContent = '🔄 Twitch SDK carregado! Aguardando autorização...';
        
        if (window.Twitch && window.Twitch.ext) {
            window.Twitch.ext.onAuthorized(function(auth) {
                document.getElementById('status').innerHTML = '✅ <strong>SUCESSO!</strong> Extensão funcionando!<br>User ID: ' + auth.userId;
                console.log('✅ Autorizado:', auth);
            });
        } else {
            document.getElementById('status').textContent = '❌ ERRO: Twitch SDK não encontrado!';
        }
    </script>
</body>
</html>
