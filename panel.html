<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardline Cupons - Panel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            padding: 20px;
            color: white;
        }

        .panel-container {
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 28px;
            letter-spacing: 3px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }
        
        h2 .line {
            color: #00d9ff;
        }

        .coupon-box {
            background: rgba(0, 217, 255, 0.1);
            border: 2px solid #00d9ff;
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
        }

        .coupon-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .coupon-code {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: 5px;
            font-family: 'Rajdhani', 'Courier New', monospace;
            margin-bottom: 15px;
            word-break: break-all;
            color: #00d9ff;
            text-shadow: 0 0 15px rgba(0, 217, 255, 0.8);
        }

        .copy-button {
            background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
            color: #0f0f1e;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
            font-family: 'Rajdhani', sans-serif;
        }

        .copy-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.5), 0 0 30px rgba(0, 217, 255, 0.3);
        }

        .info-text {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 20px;
            line-height: 1.6;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .copied-message {
            background: #4caf50;
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
            animation: fadeInOut 2s;
        }

        .copied-message.show {
            display: inline-block;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="panel-container">
        <h2 class="pulse">🎮 HARD<span class="line">LINE</span></h2>
        
        <div class="coupon-box">
            <div class="coupon-label">Use o cupom:</div>
            <div class="coupon-code" id="couponCode">CARREGANDO...</div>
            <button class="copy-button" data-action="copy">📋 Copiar Cupom</button>
            <button class="copy-button" data-action="open">🔗 Usar Agora</button>
            <div class="copied-message" id="copiedMessage">✅ Cupom copiado!</div>
        </div>

        <div class="info-text">
            💡 Clique no botão para copiar o cupom e ganhar seu desconto!<br>
            🎁 Válido para novos pedidos
        </div>
    </div>

    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="panel.js"></script>
</body>
</html>
