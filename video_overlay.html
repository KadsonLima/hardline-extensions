<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardline Cupons - Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', 'Arial', sans-serif;
            overflow: hidden;
            background: transparent;
        }

        .overlay-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .coupon-display {
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            border: 3px solid #00d9ff;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 217, 255, 0.5), 0 0 30px rgba(0, 217, 255, 0.3);
            /* VISÍVEL IMEDIATAMENTE */
            opacity: 1;
            transform: translateX(0);
            min-width: 320px;
            animation: pulseGlow 3s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 10px 40px rgba(0, 217, 255, 0.5), 0 0 30px rgba(0, 217, 255, 0.3);
            }
            50% {
                box-shadow: 0 10px 50px rgba(0, 217, 255, 0.8), 0 0 50px rgba(0, 217, 255, 0.5);
            }
        }

        .coupon-display.show {
            opacity: 1;
            transform: translateX(0);
        }

        .hardline-text {
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(0, 217, 255, 0.7), 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: textPulse 2s infinite;
        }
        
        @keyframes textPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        
        .hardline-text .line {
            color: #00d9ff;
            text-shadow: 0 0 20px rgba(0, 217, 255, 1), 0 0 30px rgba(0, 217, 255, 0.7);
        }

        .coupon-container {
            background: rgba(0, 217, 255, 0.15);
            border: 2px solid rgba(0, 217, 255, 0.4);
            padding: 18px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            /* VISÍVEL IMEDIATAMENTE */
            opacity: 1;
            transform: scale(1);
        }

        .coupon-container.show {
            opacity: 1;
            transform: scale(1);
        }

        .coupon-label {
            color: #fff;
            font-size: 14px;
            text-transfo6px;
            font-weight: 700;
            letter-spacing: 5px;
            font-family: 'Rajdhani', 'Courier New', monospace;
            text-shadow: 0 0 20px rgba(0, 217, 255, 1), 
                         0 0 40px rgba(0, 217, 255, 0.6),
                         2px 2px 4px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.3s;
            word-break: break-all;
        }

        .coupon-code:hover {
            transform: scale(1.08);
            text-shadow: 0 0 30px rgba(0, 217, 255, 1), 
                         0 0 50px rgba(0, 217, 255, 0.8);
        }

        .click-hint {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
            letter-spacing: 1px;
        }
        
        .status-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 12px;
            height: 12px;
            background: #00ff00;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }px rgba(0, 217, 255, 1), 0 0 35px rgba(0, 217, 255, 0.6);
        }

        .click-hint {
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
            margin-top: 5px;
            text-align: center;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .link-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .link-overlay.show {
            display: flex;
        }

        .link-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
        }

        .link-content h2 {
            margin-bottom: 15px;
            color: #00d9ff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
        }

        .link-content button {
            background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
            color: #0f0fstatus-indicator" title="Extensão ativa"></div>
            <div class="hardline-text">HARD<span class="line">LINE</span></div>
            <div class="coupon-container" id="couponContainer">
                <div class="coupon-label">Cupom:</div>
                <div class="coupon-code" id="couponCode" onclick="showLink()">HARDLINE10</div>
                <div class="click-hint">👆 
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Rajdhani', sans-serif;
        }

        .link-content button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="overlay-container">
        <div class="coupon-display" id="couponDisplay">
            <div class="hardline-text pulse">HARD<span class="line">LINE</span></div>
            <div class="coupon-container" id="couponContainer">
                <div class="coupon-label">Cupom:</div>
                <div class="coupon-code" id="couponCode" onclick="showLink()">CARREGANDO...</div>
                <div class="click-hint">Clique para usar o cupom</div>
            </div>
        </div>
    </div>

    <div class="link-overlay" id="linkOverlay">
        <div class="link-content">
            <h2>🎉 Use seu cupom agora!</h2>
            <p id="couponText" style="font-size: 24px; font-weight: bold; margin: 20px 0; color: #667eea;"></p>
            <button onclick="openLink()">Ir para o site</button>
            <button onclick="closeLink()" style="background: #ccc;">Fechar</button>
        </div>
    </div>

    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script>
        let currentCoupon = 'HARDLINE10';
        let targetLink = 'https://hardline.gg/';
console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.log('🎮 HARDLINE EXTENSION');
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        console.log('✅ Overlay carregado e VISÍVEL');
        console.log('📍 Posição: Canto superior direito');
        console.log('Cupom: ' + currentCoupon);
        console.log('Link: ' + targetLink);
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━');

        // Inicializar Twitch Extension
        if (window.Twitch && window.Twitch.ext) {
            console.log('✅ Twitch SDK encontrado');
            
            window.Twitch.ext.onAuthorized((auth) => {
                console.log('✅ Extension autorizada:', auth);
                document.getElementById('couponDisplay').classList.add('show');
                document.getElementById('couponContainer').classList.add('show');
            });

            // Escutar atualizações do broadcaster
            window.Twitch.ext.configuration.onChanged(() => {
                const config = window.Twitch.ext.configuration.broadcaster;
                if (config) {
                    try {
                        const data = JSON.parse(config.content);
                        if (data.coupon) {
                            currentCoupon = data.coupon;
                            document.getElementById('couponCode').textContent = currentCoupon;
                            document.getElementById('couponText').textContent = currentCoupon;
                        }
                        if (data.link) {
                            targetLink = data.link;
                        }
                    } catch (e) {
                        console.error('Erro ao parse da configuração:', e);
                    }
                }
            });
        } else {
            console.warn('⚠️ Twitch SDK não encontrado (normal se testar localmente)');
        }

        function showLink() {
            document.getElementById('linkOverlay').classList.add('show');
            document.getElementById('couponText').textContent = currentCoupon;
        }

        function closeLink() {
            document.getElementById('linkOverlay').classList.remove('show');
        }

        function openLink() {
            window.open(targetLink, '_blank');
            closeLink();
        }

        // Atualizar o cupom inicial
        document.getElementById('couponCode').textContent = currentCoupon;
    </script>
</body>
</html>
