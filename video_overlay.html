<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardline Cupons - Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', 'Arial', sans-serif;
            overflow: hidden;
            background: transparent;
        }

        .overlay-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(3px);
        }

        .coupon-display {
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            border: 8px solid #00d9ff;
            padding: 40px 60px 35px 60px;
            border-radius: 35px;
            box-shadow: 0 20px 100px rgba(0, 217, 255, 0.7), 0 0 80px rgba(0, 217, 255, 0.5);
            opacity: 1;
            transform: scale(1);
            max-width: 85%;
            max-height: 90vh;
            animation: pulseGlow 3s infinite;
            text-align: center;
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 10px 50px rgba(0, 217, 255, 0.6), 0 0 40px rgba(0, 217, 255, 0.4);
            }
            50% {
                box-shadow: 0 10px 60px rgba(0, 217, 255, 0.9), 0 0 60px rgba(0, 217, 255, 0.6);
            }
        }

        .hardline-text {
            color: #fff;
            font-size: 85px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 15px;
            margin-bottom: 25px;
            text-shadow: 0 0 40px rgba(0, 217, 255, 1), 5px 5px 15px rgba(0, 0, 0, 0.8);
            animation: textPulse 2s infinite;
        }
        
        @keyframes textPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        
        .hardline-text .line {
            color: #00d9ff;
            text-shadow: 0 0 25px rgba(0, 217, 255, 1), 0 0 40px rgba(0, 217, 255, 0.8);
        }

        .coupon-container {
            background: rgba(0, 217, 255, 0.15);
            border: 4px solid rgba(0, 217, 255, 0.5);
            padding: 25px 30px 20px 30px;
            border-radius: 18px;
            backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .coupon-container:hover {
            background: rgba(0, 217, 255, 0.28);
            border-color: rgba(0, 217, 255, 0.8);
            transform: scale(1.03);
        }

        .coupon-label {
            color: #fff;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 15px;
            opacity: 0.95;
            font-weight: 600;
        }

        .coupon-code {
            color: #00d9ff;
            font-size: 75px;
            font-weight: 700;
            letter-spacing: 12px;
            font-family: 'Rajdhani', 'Courier New', monospace;
            text-shadow: 0 0 50px rgba(0, 217, 255, 1), 
                         0 0 80px rgba(0, 217, 255, 0.9),
                         5px 5px 15px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            transition: all 0.3s;
            word-break: keep-all;
            user-select: none;
        }

        .coupon-code:hover {
            transform: scale(1.05);
            text-shadow: 0 0 60px rgba(0, 217, 255, 1), 
                         0 0 100px rgba(0, 217, 255, 1);
        }

        .click-hint {
            color: rgba(255, 255, 255, 0.9);
            font-size: 26px;
            margin-top: 18px;
            text-align: center;
            letter-spacing: 3px;
            font-weight: 600;
            animation: bounce 2s infinite;
        }
        
        .chat-command {
            color: rgba(255, 255, 255, 0.85);
            font-size: 24px;
            margin-top: 20px;
            text-align: center;
            letter-spacing: 2px;
            font-weight: 600;
            padding-top: 18px;
            border-top: 3px solid rgba(0, 217, 255, 0.3);
        }
        
        .chat-command .command {
            color: #00d9ff;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.8);
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .link-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .link-overlay.show {
            display: flex;
        }

        .link-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            border: 5px solid #00d9ff;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 70px rgba(0, 217, 255, 0.7);
        }

        .link-content h2 {
            margin-bottom: 25px;
            color: #00d9ff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 32px;
            text-shadow: 0 0 25px rgba(0, 217, 255, 0.9);
        }

        .link-content button {
            background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
            color: #0f0f1e;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
        }

        .link-content button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.8);
        }
        
        .link-content button.close-btn {
            background: linear-gradient(135deg, #555 0%, #333 100%);
            color: #fff;
        }
        
        .link-content button.close-btn:hover {
            background: linear-gradient(135deg, #666 0%, #444 100%);
        }
    </style>
</head>
<body>
    <div class="overlay-container">
        <div class="coupon-display" id="couponDisplay">
            <div class="hardline-text">HARD<span class="line">LINE</span></div>
            <div class="coupon-container" id="couponContainer">
                <div class="coupon-label">CUPOM:</div>
                <div class="coupon-code" id="couponCode">HARDLINE10</div>
                <div class="click-hint">👆 CLIQUE AQUI</div>
                <div class="chat-command">💬 Mande <span class="command">!hardline</span> no chat</div>
            </div>
        </div>
    </div>

    <div class="link-overlay" id="linkOverlay">
        <div class="link-content" id="linkContent">
            <h2>🎉 Use seu cupom!</h2>
            <p id="couponText" style="font-size: 36px; font-weight: bold; color: #00d9ff; margin: 25px 0; text-shadow: 0 0 30px rgba(0, 217, 255, 1); letter-spacing: 6px;">HARDLINE10</p>
            <button id="openLinkBtn">🚀 IR PARA O SITE</button>
            <button class="close-btn" id="closeLinkBtn">✖ FECHAR</button>
        </div>
    </div>

    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="video_overlay.js"></script>
</body>
</html>
