<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração - Hardline Cupons</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .config-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #00d9ff;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }
        
        h1 .line {
            color: #ffffff;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"],
        input[type="url"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="url"]:focus {
            outline: none;
            border-color: #00d9ff;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
        }

        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .preview {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .preview-title {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .preview-content {
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
            border: 2px solid #00d9ff;
            padding: 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
        }

        .preview-hardline {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 10px;
            font-family: 'Rajdhani', sans-serif;
        }
        
        .preview-hardline .line {
            color: #00d9ff;
        }

        .preview-coupon {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 4px;
            font-family: 'Rajdhani', 'Courier New', monospace;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            padding: 10px;
            border-radius: 5px;
            color: #00d9ff;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.6);
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
            color: #0f0f1e;
            font-family: 'Rajdhani', sans-serif;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.5), 0 0 30px rgba(0, 217, 255, 0.3);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="config-container">
        <h1>⚙️ Configuração <span class="line">HARD</span><span style="color: #00d9ff">LINE</span> Cupons</h1>
        <p class="subtitle">Configure o cupom e link que aparecerão para seus viewers</p>

        <div class="success-message" id="successMessage">
            ✅ Configurações salvas com sucesso!
        </div>

        <div class="preview">
            <div class="preview-title">📺 Preview</div>
            <div class="preview-content">
                <div class="preview-hardline">HARD<span class="line">LINE</span></div>
                <div style="font-size: 12px; margin-bottom: 5px;">Cupom:</div>
                <div class="preview-coupon" id="previewCoupon">HARDLINE10</div>
            </div>
        </div>

        <div class="form-group">
            <label for="couponInput">🎟️ Código do Cupom</label>
            <input 
                type="text" 
                id="couponInput" 
                placeholder="Ex: HARDLINE10" 
                maxlength="20"
                value="HARDLINE10"
            >
            <div class="hint">Digite o código do cupom que seus viewers devem usar</div>
        </div>

        <div class="form-group">
            <label for="linkInput">🔗 Link de Destino</label>
            <input 
                type="url" 
                id="linkInput" 
                placeholder="https://hardline.gg/" 
                value="https://hardline.gg/"
            >
            <div class="hint">URL para onde o viewer será redirecionado ao clicar no cupom</div>
        </div>

        <div class="button-group">
            <button type="button" class="btn-secondary" onclick="resetForm()">Resetar</button>
            <button type="button" class="btn-primary" onclick="saveConfig()">Salvar Configuração</button>
        </div>
    </div>

    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script>
        let twitchAuth = null;

        // Inicializar Twitch Extension
        window.Twitch.ext.onAuthorized((auth) => {
            twitchAuth = auth;
            console.log('Configuração autorizada:', auth);
            loadConfig();
        });

        // Atualizar preview em tempo real
        document.getElementById('couponInput').addEventListener('input', function() {
            document.getElementById('previewCoupon').textContent = this.value || 'HARDLINE10';
        });

        function loadConfig() {
            const config = window.Twitch.ext.configuration.broadcaster;
            if (config) {
                try {
                    const data = JSON.parse(config.content);
                    if (data.coupon) {
                        document.getElementById('couponInput').value = data.coupon;
                        document.getElementById('previewCoupon').textContent = data.coupon;
                    }
                    if (data.link) {
                        document.getElementById('linkInput').value = data.link;
                    }
                } catch (e) {
                    console.error('Erro ao carregar configuração:', e);
                }
            }
        }

        function saveConfig() {
            const coupon = document.getElementById('couponInput').value.trim();
            const link = document.getElementById('linkInput').value.trim();

            if (!coupon) {
                alert('Por favor, insira um código de cupom!');
                return;
            }

            if (!link) {
                alert('Por favor, insira um link válido!');
                return;
            }

            const config = JSON.stringify({
                coupon: coupon,
                link: link
            });

            window.Twitch.ext.configuration.set('broadcaster', '1.0', config);
            
            // Mostrar mensagem de sucesso
            const successMsg = document.getElementById('successMessage');
            successMsg.classList.add('show');
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 3000);

            console.log('Configuração salva:', config);
        }

        function resetForm() {
            document.getElementById('couponInput').value = 'HARDLINE10';
            document.getElementById('linkInput').value = 'https://hardline.gg/';
            document.getElementById('previewCoupon').textContent = 'HARDLINE10';
        }
    </script>
</body>
</html>
